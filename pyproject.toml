[project]
name = "fastculler"
version = "0.1.0"
description = "Fast photo culling application for CR3 files"
authors = [
    { name = "Logan Wu", email = "logan.wu@burnet.edu.au" }
]
dependencies = [
    "flask>=3.1.3",
    "rawpy>=0.27.0",
    "pillow>=12.0.0",
]
readme = "README.md"
requires-python = ">= 3.10"

[project.scripts]
fastculler = "fastculler.web:web_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = [
    "pytest>=9.0.3",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/fastculler"]
