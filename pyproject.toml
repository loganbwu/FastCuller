[project]
name = "fastculler"
version = "0.1.0"
description = "Fast photo culling application for CR3 files"
authors = [
    { name = "Logan Wu", email = "logan.wu@burnet.edu.au" }
]
dependencies = [
    "flask>=3.1.3",
    # rawpy dropped Intel macOS wheels for Python < 3.10 after 0.25.1 (0.26.0+ is
    # arm64-only for cp39) — cap it on old Python so old Intel Macs stuck on
    # Python 3.9 (e.g. macOS 10.13 and earlier) resolve an installable wheel
    # instead of falling back to a from-source build.
    "rawpy>=0.27.0; python_version >= '3.10'",
    "rawpy>=0.20.0,<0.26.0; python_version < '3.10'",
    # pillow 12.x requires Python >= 3.10; same old-Mac fallback as above.
    "pillow>=12.0.0; python_version >= '3.10'",
    "pillow>=11.0.0,<12.0.0; python_version < '3.10'",
]
readme = "README.md"
requires-python = ">= 3.9"

[project.scripts]
fastculler = "fastculler.web:web_main"
fastculler-write-dates = "fastculler.xmp_cli:main"
fastculler-build-thumbnails = "fastculler.thumb_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = [
    # pytest 9.x requires Python >= 3.10; same old-Mac fallback as the runtime deps above.
    "pytest>=9.0.3; python_version >= '3.10'",
    "pytest>=8.0.0,<9.0.0; python_version < '3.10'",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/fastculler"]
